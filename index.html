<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iraqerror</title>
  <meta name="description" content="TACO's profile: links, skills and five video themes.">
  <meta name="theme-color" content="#0A0A1A">
  <meta property="og:title" content="Taco Profile">
  <meta property="og:description" content="TACO's profile: links, skills and five video themes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%AE%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

  <noscript>
    <style>
      #start-screen { display: none; }
      #profile-block[hidden] { display: flex !important; }
    </style>
  </noscript>
</head>
<body class="home-theme">

  <div class="custom-cursor" aria-hidden="true"></div>

  <!-- Background video: two stacked layers so a theme change cross-fades
       only once the next video is actually ready (matters for 4K). -->
  <div class="video-stage" aria-hidden="true">
    <video class="bg-video" muted loop playsinline preload="auto"></video>
    <video class="bg-video" muted loop playsinline preload="auto"></video>
  </div>

  <canvas id="hacker-overlay" class="fx" aria-hidden="true" hidden></canvas>
  <canvas id="snow-overlay" class="fx" aria-hidden="true" hidden></canvas>
  <div class="glitch-overlay" aria-hidden="true"></div>

  <button id="start-screen" type="button" aria-label="Enter site">
    <span id="start-text" aria-hidden="true"></span>
  </button>

  <main class="stage">

    <!-- ===== Profile ===== -->
    <section id="profile-block" class="panel" aria-label="Profile" hidden>
      <div class="profile-header">
        <div class="profile-container">
          <img src="assets/profile.gif" alt="TACO's profile picture" class="profile-picture" width="150" height="150">
        </div>

        <div class="profile-info">
          <div class="name-and-badges">
            <h1 id="profile-name" data-text="TACO|" aria-label="TACO"><span class="typed" aria-hidden="true">TACO</span></h1>

            <div class="badge-box">
              <div class="badge-container has-tooltip" tabindex="0">
                <img src="assets/staff.gif" alt="Staff" class="badge" width="22" height="22">
                <span class="tooltip">Staff Member</span>
              </div>
              <div class="badge-container has-tooltip" tabindex="0">
                <img src="assets/owner.gif" alt="Owner" class="badge" width="22" height="22">
                <span class="tooltip">Owner</span>
              </div>
              <div class="badge-container has-tooltip" tabindex="0">
                <img src="assets/partner.gif" alt="Partner" class="badge" width="22" height="22">
                <span class="tooltip">Partner</span>
              </div>
              <div class="badge-container has-tooltip" tabindex="0">
                <img src="assets/developer.png" alt="Developer" class="badge" width="22" height="22">
                <span class="tooltip">Developer</span>
              </div>
              <div class="badge-container has-tooltip" tabindex="0">
                <img src="assets/bug_bounty.gif" alt="Bug Bounty" class="badge" width="22" height="22">
                <span class="tooltip">Bug Bounty</span>
              </div>
              <div class="badge-container has-tooltip" tabindex="0">
                <img src="assets/hated_guns.gif" alt="Hated by Guns.lol" class="badge" width="22" height="22">
                <span class="tooltip">Hated by Guns.lol</span>
              </div>
              <div class="badge-container has-tooltip" tabindex="0">
                <img src="assets/hated_fakecrime.gif" alt="Hated by Fakecrime.bio" class="badge" width="22" height="22">
                <span class="tooltip">Hated by Fakecrime.bio</span>
              </div>
              <div class="badge-container has-tooltip" tabindex="0">
                <img src="assets/verified.gif" alt="Verified" class="badge" width="22" height="22">
                <span class="tooltip">Verified</span>
              </div>
              <div class="badge-container has-tooltip" tabindex="0">
                <img src="assets/rule_maker.gif" alt="Rule Maker" class="badge" width="22" height="22">
                <span class="tooltip">Rule Maker</span>
              </div>
            </div>
          </div>

          <p id="profile-bio"><span class="typed" aria-hidden="true">MEXICAN</span></p>
        </div>
      </div>

      <div class="profile-footer">
        <nav class="social-links" aria-label="Social links">
          <a class="social-link" href="https://open.spotify.com/user/alexvuriles" target="_blank" rel="noopener noreferrer" aria-label="Spotify">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><g fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"><path d="M6 9.2c4-1.2 8.4-.9 12 1"/><path d="M6.6 12.6c3.4-.9 7-.6 10 1"/><path d="M7.4 15.8c2.8-.7 5.5-.4 8 .8"/></g></svg>
          </a>
          <a class="social-link" href="https://tiktok.com/@laggytac" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
            <img src="assets/tiktok.png" alt="" class="social-icon" width="36" height="36">
          </a>
          <a class="social-link" href="https://instagram.com/elcompa_ortiz" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.6" cy="6.4" r="1.3" fill="currentColor"/></svg>
          </a>
          <a class="social-link" href="https://youtube.com/@laggytaco4201" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
            <img src="assets/youtube.png" alt="" class="social-icon" width="36" height="36">
          </a>
          <a class="social-link" href="https://github.com/iraqerrorr" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <img src="assets/github.png" alt="" class="social-icon" width="36" height="36">
          </a>
        </nav>

        <div class="visitor-counter has-tooltip" tabindex="0">
          <svg class="visitor-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
          <span id="visitor-count">158</span>
          <span class="tooltip">Profile Views</span>
        </div>
      </div>
    </section>

    <!-- ===== Skills ===== -->
    <section id="skills-block" class="panel" aria-label="Programming skills" hidden>
      <h2 class="skills-title">Programming Skills</h2>

      <div class="skill">
        <div class="skill-name">
          <span class="skill-label"><img src="assets/python.png" alt="" class="skill-icon" width="22" height="22"><span>Python</span></span>
          <span>87%</span>
        </div>
        <div class="skill-bar-container" role="progressbar" aria-label="Python" aria-valuemin="0" aria-valuemax="100" aria-valuenow="87">
          <div class="skill-bar" data-skill="python" data-level="87"></div>
        </div>
      </div>

      <div class="skill">
        <div class="skill-name">
          <span class="skill-label"><img src="assets/cpp.png" alt="" class="skill-icon" width="22" height="22"><span>C++</span></span>
          <span>75%</span>
        </div>
        <div class="skill-bar-container" role="progressbar" aria-label="C++" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75">
          <div class="skill-bar" data-skill="cpp" data-level="75"></div>
        </div>
      </div>

      <div class="skill">
        <div class="skill-name">
          <span class="skill-label"><img src="assets/csharp.png" alt="" class="skill-icon" width="22" height="22"><span>C#</span></span>
          <span>80%</span>
        </div>
        <div class="skill-bar-container" role="progressbar" aria-label="C#" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
          <div class="skill-bar" data-skill="csharp" data-level="80"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Hacker theme only -->
  <div id="results-button-container" hidden>
    <button id="results-theme" type="button" aria-pressed="false">View Results</button>
    <div id="results-hint" hidden>Click again to return to profile</div>
  </div>

  <!-- Themes + settings -->
  <div class="dock">
    <div class="dock-row" role="group" aria-label="Theme">
      <button type="button" class="theme-button" data-theme="home"   aria-label="Home theme (1)"   title="Home (1)"   aria-pressed="true">1</button>
      <button type="button" class="theme-button" data-theme="hacker" aria-label="Hacker theme (2)" title="Hacker (2)" aria-pressed="false">2</button>
      <button type="button" class="theme-button" data-theme="rain"   aria-label="Rain theme (3)"   title="Rain (3)"   aria-pressed="false">3</button>
      <button type="button" class="theme-button" data-theme="anime"  aria-label="Anime theme (4)"  title="Anime (4)"  aria-pressed="false">4</button>
      <button type="button" class="theme-button" data-theme="car"    aria-label="Car theme (5)"    title="Car (5)"    aria-pressed="false">5</button>
    </div>

    <div class="dock-row" role="group" aria-label="Settings">
      <button type="button" id="mute-btn" class="icon-btn" aria-label="Mute music" aria-pressed="false" title="Mute (M)">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
          <path class="wave" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728"/>
          <path class="mute-x" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
        </svg>
      </button>
      <input id="volume-slider" class="slider" type="range" min="0" max="1" step="0.01" value="0.3" aria-label="Music volume">

      <svg class="transparency-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
      </svg>
      <input id="transparency-slider" class="slider" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Panel opacity">
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Only the first track is fetched up front; the rest load when their theme is picked. -->
  <audio id="background-music" loop preload="auto"><source src="assets/background_music.mp3" type="audio/mpeg"></audio>
  <audio id="hacker-music" loop preload="none"><source src="assets/hacker_music.mp3" type="audio/mpeg"></audio>
  <audio id="rain-music" loop preload="none"><source src="assets/rain_music.mp3" type="audio/mpeg"></audio>
  <audio id="anime-music" loop preload="none"><source src="assets/anime_music.mp3" type="audio/mpeg"></audio>
  <audio id="car-music" loop preload="none"><source src="assets/car_music.mp3" type="audio/mpeg"></audio>
</body>
</html>
